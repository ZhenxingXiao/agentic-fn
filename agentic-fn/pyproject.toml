[project]
name = "agentic-fn"
version = "0.1.0"
description = "Functional, production-oriented agent/knowledge-base pipeline framework"
readme = "README.md"
authors = [
    { name = "albert", email = "xiaozhenxing.albert@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
openai-compatible = []
dashscope = ["dashscope>=1.20.0"]
laya = []
models-all = ["agentic-fn[openai,dashscope]"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
