[project]
name = "cli"
version = "0.1.0"
description = "Command-line demos for exploring agentic-fn pipeline features"
readme = "README.md"
authors = [
    { name = "albert", email = "xiaozhenxing.albert@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentic-fn",
    "picologging>=0.9.3",
]

[project.scripts]
cli = "cli.app:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
agentic-fn = { path = "../agentic-fn", editable = true }
